# id_x_008 HAProxy 负载均衡配置
# 统一入口 sme-activity-apply.cuhk.edu.cn，SSL 终止于 HAProxy，
# /b/id_x_008/graphql 经健康检查后轮询分发至多个后端实例。

global
    log /dev/log local0
    maxconn 4096
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend sme_aa
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/cuhk-edu-cn.pem
    http-request redirect scheme https unless { ssl_fc }
    default_backend litestar_nodes

backend litestar_nodes
    balance roundrobin
    option httpchk GET /b/id_x_008/health
    http-check expect status 200
    server node1 127.0.0.1:8101 check
    server node2 127.0.0.1:8102 check
