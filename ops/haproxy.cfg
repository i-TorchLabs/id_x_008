# id_x_008 HAProxy 配置（参照 id_x_003 模式：后端主机由环境变量注入）
#   Pod 模式(up.sh)：SERVICE_HOST/WEB_HOST = 127.0.0.1（共享网络命名空间）
#   compose 模式：   SERVICE_HOST=service, WEB_HOST=web（DNS 服务名互访）
global
    maxconn 2048

defaults
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 600s

frontend http_in
    bind *:8080

    # 安全响应头（纵深防御）
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options DENY
    http-response set-header Referrer-Policy no-referrer

    acl is_api path_beg /b/id_x_008/
    use_backend service_backend if is_api
    default_backend web_backend

backend service_backend
    option httpchk GET /b/id_x_008/health
    http-check expect status 200
    server service "${SERVICE_HOST}:8101" check

backend web_backend
    server web "${WEB_HOST}:2008" check
