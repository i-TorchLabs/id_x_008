name: id_x_008

services:
  db:
    image: docker.io/library/postgres:18
    container_name: id_x_008_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    #   - "45432:5432"  # 安全策略：数据库端口不对外暴露（仅 Pod 内互访）
    volumes:
      - id_x_008_db_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  service:
    build:
      context: ../../..
      dockerfile: x_models/id_x_008/ops/Dockerfile.service
    image: id_x_008_service:latest
    container_name: id_x_008_service
    restart: unless-stopped
    # ⚠️ 安全提示：生产环境建议使用 Podman Secrets 或 K8s Secrets 替代明文环境变量注入凭据
    # 当前通过 .env 文件注入 DB_PASSWORD / IAO_MAIL_PASSWORD 等敏感值
    # 可使用 encrypted DB creds（IAO_DB_ENCRYPTED=true + IAO_SECRET_KEY）作为过渡方案
    environment:
      DB_NAME: ${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      IAO_DB_ENCRYPTED: ${IAO_DB_ENCRYPTED:-}
      IAO_SECRET_KEY: ${IAO_SECRET_KEY:-}
      IAO_MAIL_PASSWORD: ${IAO_MAIL_PASSWORD:-}
      IAO_PORT: "8101"
      PROJECT_PATH: /app/i-Core
    volumes:
      # 日志挂载:宿主机 x_models/id_x_008/logs -> 容器 /app/i-Core/logs
      - ../logs:/app/i-Core/logs
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: id_x_008_web:latest
    container_name: id_x_008_web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://service:8101
    depends_on:
      - service

  haproxy:
    image: docker.io/library/haproxy:3.2
    container_name: id_x_008_haproxy
    restart: unless-stopped
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    environment:
      SERVICE_HOST: service
      WEB_HOST: web
    ports:
      - "8008:8080"
    depends_on:
      - service
      - web

volumes:
  id_x_008_db_data:
